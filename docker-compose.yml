# Runs ONLY the migrator. It connects to YOUR existing MongoDB and ClickHouse
# via env vars — copy .env.example to .env and point it at them.
# (From a container, "localhost" on the host machine is host.docker.internal.)
services:
  migration:
    build: .
    env_file: .env
    ports:
      - "${SERVICE_PORT:-8080}:${SERVICE_PORT:-8080}"
    restart: unless-stopped
