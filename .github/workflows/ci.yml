name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck + differential harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Asserts src/transform/ reproduces countly-platform's live ingestion
      # normalization exactly (vendored goldens in tests/differential/).
      # Pure unit tests — no MongoDB/ClickHouse/Redis required.
      - name: Ingestion-matching differential harness
        run: npx vitest run tests/differential

  integration:
    name: Integration (MongoDB 7 + ClickHouse 26.4)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # Production ClickHouse version (deploy/compose/images.standard.env
        # in countly-platform). 26.4 requires a password for non-localhost
        # clients — the tests read TEST_CLICKHOUSE_PASSWORD.
        image: clickhouse/clickhouse-server:26.4
        env:
          CLICKHOUSE_PASSWORD: ci-pass
        ports: ['8123:8123']
        options: >-
          --health-cmd "clickhouse-client --password ci-pass --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_CLICKHOUSE_PASSWORD: ci-pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single-node REPLICA SET (not a plain service container): the mirror
      # engine tails a change stream, which standalone mongod cannot serve.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name ci-mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true && break
            sleep 1
          done
          docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full engine suite: ledger store semantics, e2e chunk pipeline with
      # DLQ/coercions/null-cd sweep, multi-collection scoping regressions,
      # ledger rebuild, duplicate attribution, pair-based attach recovery.
      - name: Integration tests
        run: npx vitest run tests/integration
